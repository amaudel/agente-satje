name: Validacion SATJE (PR)
on:
  pull_request:
    paths:
      - 'api/**'
      - 'lib/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/satje-validation.yml'
  push:
    branches:
      - 'fix/satje-auditoria-evidencia-20261012'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
